name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Security — assert no eval() usage
        run: |
          if grep -rn "eval(" src/ --include="*.ts"; then
            echo "FAIL: eval() found in src/ — this is a critical security violation"
            exit 1
          fi
          if grep -rn "new Function(" src/ --include="*.ts"; then
            echo "FAIL: new Function() found in src/ — this is a critical security violation"
            exit 1
          fi
          echo "PASS: no eval() or new Function() in source"

      - name: Build
        run: npm run build

      - name: Assert dist files exist
        run: |
          test -f dist/index.cjs || (echo "FAIL: dist/index.cjs missing" && exit 1)
          test -f dist/index.js || (echo "FAIL: dist/index.js missing" && exit 1)
          test -f dist/index.d.ts || (echo "FAIL: dist/index.d.ts missing" && exit 1)
          test -f dist/index.d.cts || (echo "FAIL: dist/index.d.cts missing" && exit 1)
          echo "PASS: all dist files present"

      - name: Package smoke test — verify import/require actually work
        run: |
          npm pack
          mkdir -p /tmp/pkg-smoke-test
          cp simple-authz-v2-*.tgz /tmp/pkg-smoke-test/pkg.tgz
          cd /tmp/pkg-smoke-test
          npm init -y >/dev/null 2>&1
          npm install ./pkg.tgz --no-audit --no-fund
          echo "import { Authz } from 'simple-authz-v2'; if (typeof Authz !== 'function') throw new Error('ESM import failed')" > test-esm.mjs
          echo "const { Authz } = require('simple-authz-v2'); if (typeof Authz !== 'function') throw new Error('CJS require failed')" > test-cjs.cjs
          node test-esm.mjs && echo "PASS: ESM import works"
          node test-cjs.cjs && echo "PASS: CJS require works"

      - name: Upload coverage
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7